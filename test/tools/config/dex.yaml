# Dex stands in for the identity provider. Static passwords keep the sweep
# headless: no browser, no real IdP account, nothing to rotate.
issuer: http://localhost:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
staticClients:
  - id: oauth2-proxy
    name: oauth2-proxy
    secret: proxy-secret-123
    redirectURIs:
      - http://localhost:8000/oauth2/callback
enablePasswordDB: true
staticPasswords:
  # tester@example.com / password  (bcrypt of "password")
  - email: "tester@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "tester"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
