name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release pull request up to date: it reads the conventional commits
  # since the last tag, works out the next semantic version, rewrites the
  # changelog and bumps the manifest. Merging that pull request is what cuts a
  # release, so the decision stays a human one while the version number does
  # not.
  prepare:
    name: Prepare the release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only runs on the push that merged a release pull request.
  publish:
    name: Build and publish
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every target
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: ./scripts/build-release.sh "$VERSION" dist

      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

  # Points the Homebrew formula at the release that was just published, so
  # `brew install dhanesh/tap/albauth` and `brew upgrade` pick it up. Runs only
  # after the binaries are attached, and hashes the SHA256SUMS that was actually
  # published rather than a local rebuild. Pushing to the tap needs a token with
  # contents: write on dhanesh/homebrew-tap, stored as HOMEBREW_TAP_TOKEN; the
  # workflow's own GITHUB_TOKEN cannot write to another repository.
  homebrew:
    name: Update the Homebrew tap
    needs: [prepare, publish]
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: dhanesh/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write the formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS --output "$RUNNER_TEMP/SHA256SUMS"
          ./scripts/homebrew-formula.sh "$TAG" "$RUNNER_TEMP/SHA256SUMS" > tap/Formula/albauth.rb
          ruby -c tap/Formula/albauth.rb

      - name: Push it to the tap
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        working-directory: tap
        run: |
          if git diff --quiet; then
            echo "Formula/albauth.rb already points at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "albauth ${TAG#v}"
          # Other projects release into the same tap, so a push can lose a race
          # and be rejected. Each one writes only its own formula, so rebasing
          # onto theirs is always clean.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $attempt); rebasing onto the tap and retrying"
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          echo "could not push to the tap after 5 attempts" >&2
          exit 1
